name: Deploy the website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the website
        uses: actions/checkout@v4

      - name: Checkout the DisTube sources
        uses: actions/checkout@v4
        with:
          repository: skick1234/DisTube
          ref: main
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the dependencies
        run: npm ci

      - name: Build the website
        run: npm run build
        env:
          # The API reference is generated from the sources of the library.
          DISTUBE_SOURCE: ./source

      - name: Configure the pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
